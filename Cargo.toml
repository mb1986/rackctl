[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
authors = ["Michał Blinkiewicz <michal.blinkiewicz@gmail.com>"]
description = "Monitor and control rack devices from the command line or a TUI"
repository = "https://github.com/mb1986/rackctl"
readme = "README.md"
keywords = ["rack", "homelab", "pdu", "tui", "datacenter"]
categories = ["command-line-utilities"]
publish = false

[workspace.dependencies]
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
miette = "7.6.0"
strum = { version = "0.28.0", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
